{% extends "demo/base.html" %}

{% block content %}
<style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

    :root {
        --primary-orange: #ff6b35;
        --nav-width: 60px;
        --sidebar-width: 320px;
        --border-color: #f0f0f0;
        --bg-light: #f8f9fa;
        --peach-bg: #fff4f0;
        --text-main: #111827;
        --text-muted: #6b7280;
    }

    body {
        font-family: 'Inter', sans-serif;
        background-color: #fbfbfb;
        color: var(--text-main);
    }

    .app-layout {
        display: flex;
        height: calc(100vh - 72px);
        margin-top: -1.5rem;
        background: #fbfbfb;
        overflow: hidden;
    }

    /* Left Sidebar Navigation */
    .icon-nav {
        width: var(--nav-width);
        background: #fff;
        border-right: 1px solid var(--border-color);
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 1.25rem 0;
        gap: 1.25rem;
        flex-shrink: 0;
    }

    .nav-icon {
        width: 36px;
        height: 36px;
        border-radius: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #9ca3af;
        text-decoration: none;
        transition: all 0.2s;
        position: relative;
    }

    .nav-icon:hover {
        background: var(--peach-bg);
        color: var(--primary-orange);
    }

    .nav-icon.active {
        background: var(--peach-bg);
        color: var(--primary-orange);
    }

    .nav-icon.active::before {
        content: '';
        position: absolute;
        left: -12px;
        top: 6px;
        bottom: 6px;
        width: 4px;
        background: var(--primary-orange);
        border-radius: 0 4px 4px 0;
    }

    /* Top Bar */
    .top-header-bar {
        height: 60px;
        background: #fff;
        border-bottom: 1px solid var(--border-color);
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 2rem;
        position: sticky;
        top: 0;
        z-index: 100;
        margin-top: -1.5rem; /* Match app-layout offset if needed, or adjust */
    }

    .header-left-tools {
        display: flex;
        gap: 1rem;
    }

    .tool-btn {
        width: 32px;
        height: 32px;
        border: 1px solid var(--border-color);
        border-radius: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--text-muted);
        background: #fff;
        cursor: pointer;
    }

    .header-right-tools {
        display: flex;
        align-items: center;
        gap: 1.25rem;
    }

    .btn-upgrade {
        background: #fff4f0;
        color: var(--primary-orange);
        border: 1px solid rgba(255, 107, 53, 0.2);
        padding: 0.4rem 1rem;
        border-radius: 8px;
        font-size: 0.85rem;
        font-weight: 600;
        display: flex;
        align-items: center;
        gap: 0.5rem;
        text-decoration: none;
    }

    /* Container for Content Area */
    .dashboard-container {
        flex: 1;
        overflow: hidden;
        display: flex;
        flex-direction: column;
    }

    /* Sub-sidebar (Chat list or KB stats) */
    .sub-sidebar {
        width: var(--sidebar-width);
        border-right: 1px solid var(--border-color);
        display: flex;
        flex-direction: column;
        background: #fff;
        flex-shrink: 0;
        overflow-y: auto;
    }

    /* Main Content Area */
    .main-view {
        flex: 1;
        background: #fcfcfc;
        display: flex;
        flex-direction: column;
        overflow-y: auto;
    }

    /* FAB */
    .floating-chat-btn {
        position: fixed;
        bottom: 2rem;
        right: 2rem;
        width: 60px;
        height: 60px;
        background: var(--primary-orange);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #fff;
        box-shadow: 0 4px 20px rgba(255, 107, 53, 0.4);
        cursor: pointer;
        z-index: 1000;
        transition: transform 0.2s;
    }

    .floating-chat-btn:hover { transform: scale(1.1); }
    
    {% block extra_style %}{% endblock %}
</style>

<div class="top-header-bar">
    <div class="header-left-tools">
        <div class="tool-btn"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"></path><polyline points="16 6 12 2 8 6"></polyline><line x1="12" y1="2" x2="12" y2="15"></line></svg></div>
        <div class="tool-btn"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg></div>
    </div>
    <div class="header-right-tools">
        <a href="#" class="btn-upgrade">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon></svg>
            Upgrade
        </a>
        <div class="tool-btn border-0"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><line x1="2" y1="12" x2="22" y2="12"></line><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path></svg></div>
        <div class="tool-btn border-0"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg></div>
    </div>
</div>

<div class="app-layout">
    <!-- Shared Vertical Icon Nav -->
    <nav class="icon-nav">
        <a href="{% url 'agent_list' %}" class="nav-icon" title="Agents">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
        </a>
        <a href="{% url 'live_chat' assistant_id %}" class="nav-icon {% if active_channel == 'live_chat' %}active{% endif %}" title="Live Chat">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
        </a>
        <a href="{% url 'whatsapp_chat' assistant_id %}" class="nav-icon {% if active_channel == 'whatsapp' %}active{% endif %}" title="WhatsApp">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path></svg>
        </a>
        <a href="{% url 'knowledge_base' assistant_id %}" class="nav-icon {% if active_tab %}active{% endif %}" title="Knowledge Base">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg>
        </a>
        <div class="mt-auto">
            <a href="#" class="nav-icon" title="Settings">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
            </a>
        </div>
    </nav>

    {% block sub_sidebar %}{% endblock %}

    <div class="dashboard-container">
        <main class="main-view">
            {% block main_content %}{% endblock %}
        </main>
    </div>
</div>

<div class="floating-chat-btn">
    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15.2a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
</div>

{% block extra_script %}{% endblock %}
{% endblock %}
